name: Commit Message Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-commit-messages:
    name: Validate Commit Messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r message; do
            if ! printf '%s\n' "$message" |
              grep -Eq '^Jira:[0-9]+[[:space:]]+[^[:space:]].*$'; then
              echo "ERROR: Invalid commit message: $message"
              echo "Required format: Jira:<ticket-number> <description>"
              exit 1
            fi
          done < <(git log --format=%s "$BASE_SHA..$HEAD_SHA")

          echo "All commit messages are valid."
